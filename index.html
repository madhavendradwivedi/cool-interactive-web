<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> TITLE </title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-pink: #ff85a1; --dark-pink: #ff0a54; --text-dark: #2d0010; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--neon-pink); color: var(--text-dark); font-family: 'Poppins', sans-serif; overflow: hidden; }
        
        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: absolute; top: 0; left: 0; background: var(--neon-pink); }
        .active { display: flex; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .neon-title { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #fff; text-shadow: 2px 2px 10px var(--dark-pink); margin: 10px; }
        .btn { background: var(--dark-pink); border: none; padding: 12px 35px; border-radius: 50px; color: white; font-weight: 600; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 10, 84, 0.4); transition: 0.3s; z-index: 100; margin-top: 20px; }

        .photo-card, .photo-frame { width: 260px; height: 360px; background: #fff; padding: 10px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        .photo-card img, .photo-frame img { width: 100%; height: 80%; object-fit: cover; border-radius: 8px; background: #eee; }
        .photo-card p, .photo-frame p { color: var(--dark-pink); font-weight: bold; margin-top: 10px; }

        #game-area { width: 90%; max-width: 350px; height: 300px; position: relative; background: rgba(255, 255, 255, 0.3); border: 3px solid #fff; border-radius: 20px; overflow: hidden; }
        .balloon { position: absolute; font-size: 35px; cursor: pointer; }

        .final-box { width: 85%; max-width: 500px; height: 75vh; background: #2d0010; padding: 25px; border-radius: 25px; border: 3px solid #fff; overflow-y: auto; text-align: left; }
        .final-box p { line-height: 1.8; color: #ffccd5; white-space: pre-wrap; }

        #no-btn { position: absolute; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="screen1" class="screen active">
        <h1 class="neon-title">There Name </h1>
        <button class="btn" id="holdBtn">Hold to Start ⏳</button>
    </div>

    <div id="screen2" class="screen">
        <h2 style="color:#fff">Catch My Love!</h2>
        <p>Pop 5 hearts: <span id="score">0</span>/5</p>
        <div id="game-area"></div>
    </div>

    <div id="screen3" class="screen">
        <h2 style="color:#fff">Match Feelings 🧩</h2>
        <div id="memoryGrid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;"></div>
    </div>

    <div id="screen4" class="screen">
        <h1 class="neon-title" style="font-size: 3rem;">Will You Be My Valentine?</h1>
        <p id="funnyMsg" style="height:45px; color: #fff; font-weight: bold; font-size: 1.1rem; padding: 0 10px;"></p>
        <div style="position: relative; width: 100%; height: 200px;">
            <button class="btn" style="position: absolute; left: 15%; top: 20px;" onclick="showBigReveal()">YES! ❤️</button>
            <button class="btn" id="no-btn" style="left: 60%; top: 20px;">No</button>
        </div>
    </div>

    <div id="screen5" class="screen">
        <h1 style="font-size: 4rem; color: #fff; text-shadow: 0 0 25px var(--dark-pink); margin: 0;">I LOVE YOU!</h1>
        <button class="btn" onclick="showMemories()">Our Memories 📸</button>
    </div>

    <div id="screen6" class="screen">
        <h2 class="neon-title" style="font-size: 2.5rem;">Our Memories 📸</h2>
        <div class="slideshow-container">
            <div class="mySlides fade">
                <div class="photo-card"><img src="photo1.jpg" onerror="this.src='https://via.placeholder.com/260x360?text=Photo+1'"><p>Humari Pehli Mulakat ❤️</p></div>
            </div>
            <div class="mySlides fade" style="display:none">
                <div class="photo-card"><img src="photo2.jpg" onerror="this.src='https://via.placeholder.com/260x360?text=Photo+2'"><p>Wo Cute Si Baatein ✨</p></div>
            </div>
            <div class="mySlides fade" style="display:none">
                <div class="photo-card"><img src="photo3.jpg" onerror="this.src='https://via.placeholder.com/260x360?text=Photo+3'"><p>Hamesha Saath Rehna 💍</p></div>
            </div>
        </div>
        <button class="btn" onclick="startWeek()">One last thing... ✨</button>
    </div>

    <div id="screen7" class="screen">
        <div id="week-content" style="display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <div id="screen8" class="screen">
        <div class="final-box">
            <h2 style="color:var(--neon-pink); text-align:center; font-family:'Great Vibes';">My Forever...</h2>
            <p id="longMessage"></p>
            <div style="text-align: center; font-size: 3rem; margin-top: 15px;">💖💍✨</div>
        </div>
    </div>

    <script>
        const longText = ` your customize paragraph `;
        
        const weekData = [
            { day: "Rose Day 🌹", img: "day1.jpg" }, { day: "Propose Day 💍", img: "day2.jpg" },
            { day: "Chocolate Day 🍫", img: "day3.jpg" }, { day: "Teddy Day 🧸", img: "day4.jpg" },
            { day: "Promise Day 🤝", img: "day5.jpg" }, { day: "Hug Day 🤗", img: "day6.jpg" },
            { day: "Kiss Day 💋", img: "day7.jpg" }, { day: "Valentine's Day ❤️", img: "day8.jpg" }
        ];

        const funnyMsgs = [
            "Koshish achhi hai, par peecha nahi chhodunga! 😂❤️",
            "Error 404: 'No' option not found! 😜",
            "Mummy ko bol dunga... ab dekh lo! 💀💖",
            "Ouch! Dil tod diya aapne... Maan jao na! 🥺✨",
            "Ye button kharab hai, YES hi dabana padega! 😏",
            "Zidd chodo, hum perfect hain saath mein! 💍",
            "Arey click karke toh dekho, 'No' mana hai! 😂"
        ];

        let msgIndex = 0;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 1. Hold
        let holdTimer;
        const hBtn = document.getElementById('holdBtn');
        const hStart = () => holdTimer = setTimeout(() => { 
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Audio blocked")); 
            showScreen('screen2'); 
            startBalloonGame(); 
        }, 1500);
        hBtn.onmousedown = hStart; hBtn.ontouchstart = hStart;
        hBtn.onmouseup = () => clearTimeout(holdTimer);
        hBtn.ontouchend = () => clearTimeout(holdTimer);

        // 2. Balloon Game
        function startBalloonGame() {
            const area = document.getElementById('game-area');
            let popped = 0;
            const interval = setInterval(() => {
                const b = document.createElement('div'); b.className = 'balloon'; b.innerHTML = '❤️';
                b.style.left = Math.random() * 80 + 10 + '%'; b.style.top = '300px';
                area.appendChild(b);
                let pos = 300;
                const move = setInterval(() => {
                    if (pos < -50) { clearInterval(move); b.remove(); }
                    else { pos -= 2.5; b.style.top = pos + 'px'; }
                }, 20);
                b.onclick = () => { popped++; document.getElementById('score').innerText = popped; b.remove();
                    if (popped >= 5) { clearInterval(interval); setTimeout(() => { showScreen('screen3'); initMemory(); }, 500); }
                };
            }, 700);
        }

        // 3. Memory Game (Fixed Logic)
        function initMemory() {
            const icons = ['🍭', '🍭', '🧸', '🧸', '🎁', '🎁'];
            const shuffled = icons.sort(() => 0.5 - Math.random());
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            let selected = [];
            let matchedPairs = 0;

            shuffled.forEach(icon => {
                const card = document.createElement('div');
                card.style.cssText = "width:75px; height:75px; background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2rem; cursor:pointer; color:transparent; border: 2px solid #fff; transition: 0.3s;";
                card.innerHTML = icon;
                
                card.onclick = function() {
                    if (selected.length < 2 && this.style.color !== "var(--dark-pink)") {
                        this.style.color = "var(--dark-pink)";
                        this.style.background = "#ffe5ec";
                        selected.push(this);

                        if (selected.length === 2) {
                            if (selected[0].innerHTML === selected[1].innerHTML) {
                                matchedPairs++;
                                selected = [];
                                if (matchedPairs === 3) {
                                    setTimeout(() => { showScreen('screen4'); }, 800);
                                }
                            } else {
                                setTimeout(() => {
                                    selected[0].style.color = "transparent";
                                    selected[0].style.background = "#fff";
                                    selected[1].style.color = "transparent";
                                    selected[1].style.background = "#fff";
                                    selected = [];
                                }, 600);
                            }
                        }
                    }
                };
                grid.appendChild(card);
            });
        }

        // 4. NO BUTTON CLICK
        const noBtn = document.getElementById('no-btn');
        noBtn.onclick = () => {
            noBtn.style.left = Math.random() * 70 + 10 + '%';
            noBtn.style.top = Math.random() * 70 + 10 + '%';
            document.getElementById('funnyMsg').innerText = funnyMsgs[msgIndex];
            msgIndex = (msgIndex + 1) % funnyMsgs.length;
        };

        function showBigReveal() {
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
            showScreen('screen5');
        }

        // 6. Memories Slideshow
        let slideInterval;
        function showMemories() {
            showScreen('screen6');
            let slideIdx = 0;
            let slides = document.getElementsByClassName("mySlides");
            slideInterval = setInterval(() => {
                for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
                slideIdx++;
                if (slideIdx > slides.length) slideIdx = 1;
                slides[slideIdx-1].style.display = "block";
            }, 2500);
        }

        // 7. Valentine Week Slideshow (Last Button Fix)
        function startWeek() {
            if (slideInterval) clearInterval(slideInterval);
            showScreen('screen7');
            let currentDay = 0;
            const content = document.getElementById('week-content');
            
            function nextSlide() {
                if (currentDay < weekData.length) {
                    const d = weekData[currentDay];
                    const isLastDay = (currentDay === weekData.length - 1);
                    const buttonText = isLastDay ? "Open Your Love Letter 💌" : "Next Day ✨";
                    
                    content.innerHTML = `
                        <div class="photo-frame">
                            <img src="${d.img}" onerror="this.src='https://via.placeholder.com/260x360?text=Valentine'">
                            <p>${d.day}</p>
                        </div>
                        <p style="font-size: 0.9rem; color: #fff; font-style: italic; margin: 0;">
                            ${isLastDay ? "Last but not the least..." : ""}
                        </p>
                        <button class="btn" onclick="window.next()">${buttonText}</button>`;
                    currentDay++;
                } else { 
                    showScreen('screen8'); 
                    document.getElementById('longMessage').innerText = longText; 
                }
            }
            window.next = nextSlide; 
            nextSlide();
        }
    </script>
</body>
</html>
